spring.application.name=staffhub
server.port=8080

# ---------------------------------------------------------------- H2 (default)
# Zero-setup in-memory database; data resets on restart and is reseeded by
# DataLoader. H2 console: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:staffhub)
spring.datasource.url=jdbc:h2:mem:staffhub;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------- MySQL
# To persist data with MySQL instead: create the database, comment out the
# five H2 lines above, uncomment the block below (and add the mysql connector
# dependency: runtimeOnly 'com.mysql:mysql-connector-j').
# spring.datasource.url=jdbc:mysql://localhost:3306/staffhub
# spring.datasource.username=root
# spring.datasource.password=secret
# spring.jpa.hibernate.ddl-auto=update

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Serialize java.time types as ISO-8601 strings ("2026-08-20", "09:14:00").
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.com.staffhub=INFO

# Annual paid-leave quota (working days) used for employee leave balances.
staffhub.leave.annual-quota=24
